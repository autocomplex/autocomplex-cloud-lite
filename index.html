<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autocomplex Cloud Lite</title><style>body{font:16px system-ui;background:#0e1b32;color:#eef5ff;margin:0;padding:16px}main{max-width:760px;margin:auto}input,button{box-sizing:border-box;width:100%;padding:14px;margin:7px 0;border-radius:9px;border:1px solid #64748b;font:inherit}button{background:#1976df;color:white;border:0}button:disabled{opacity:.5}.edit{margin-top:8px;padding:9px;font-size:14px}.price-form{padding:10px;background:#182b47;border-radius:8px}.price-form label{display:block;font-size:13px}.price-form input{margin:3px 0 9px}.notice{color:#fcd34d}.item{padding:12px;border-bottom:1px solid #46536a}.muted{color:#b7c7dc;font-size:13px}#app{display:none}#message{white-space:pre-wrap}</style></head><body><main><h2>Автокомплекс · Cloud Lite</h2><p class="muted">Каталог · редагування цін для авторизованих користувачів · потрібен інтернет</p><section id="login"><input id="url" placeholder="https://PROJECT.supabase.co" autocomplete="url"><input id="key" placeholder="Publishable key (sb_publishable_...)" autocomplete="off"><input id="email" type="email" placeholder="Email" autocomplete="username"><input id="password" type="password" placeholder="Пароль" autocomplete="current-password"><label class="muted" style="display:flex;align-items:center;gap:9px"><input id="remember" type="checkbox" checked style="width:auto;margin:0">Запам’ятати вхід на цьому пристрої</label><button id="enter">Увійти</button><p class="muted">Пароль не зберігається. Якщо ввімкнути запам’ятовування, токени сесії зберігатимуться у браузері. Не вмикайте на чужому пристрої.</p></section><section id="app"><button id="exit">Вийти</button><input id="search" placeholder="Назва або артикул"><button id="find">Знайти</button><p id="count"></p><div id="items"></div><button id="more" style="display:none">Ще товари</button></section><p id="message" role="status"></p></main><script>
'use strict';const $=id=>document.getElementById(id);let token='',refreshToken='',expiresAt=0,offset=0,query='',busy=false;const SESSION_KEY='acl_session_v1';$('remember').checked=localStorage.getItem('acl_remember')!=='false';for(const id of ['url','key','email'])$(id).value=localStorage.getItem('acl_'+id)||'';function msg(t){$('message').textContent=t}
function clearSession(){localStorage.removeItem(SESSION_KEY);sessionStorage.removeItem(SESSION_KEY);token='';refreshToken='';expiresAt=0}
function storeSession(){const data=JSON.stringify({token,refreshToken,expiresAt,u:$('url').value.trim().replace(/\/$/,''),k:$('key').value.trim(),email:$('email').value.trim()});localStorage.removeItem(SESSION_KEY);sessionStorage.removeItem(SESSION_KEY);($('remember').checked?localStorage:sessionStorage).setItem(SESSION_KEY,data)}
function acceptSession(d){if(!d.access_token||!d.refresh_token)throw Error('Сервер не повернув токени сесії');token=d.access_token;refreshToken=d.refresh_token;expiresAt=Date.now()+Math.max(1,Number(d.expires_in)||3600)*1000;storeSession()}
let refreshPromise=null;
async function ensureToken(){if(!token)throw Error('Сесію завершено. Увійдіть повторно.');if(Date.now()<expiresAt-60000)return token;if(refreshPromise)return refreshPromise;refreshPromise=(async()=>{const {u,k}=config();const r=await fetch(u+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'Content-Type':'application/json',apikey:k},body:JSON.stringify({refresh_token:refreshToken})});const d=await json(r);acceptSession(d);return token})().catch(e=>{clearSession();$('app').style.display='none';$('login').style.display='block';throw Error('Термін сесії закінчився. Увійдіть повторно. '+e.message)}).finally(()=>{refreshPromise=null});return refreshPromise}
async function restoreSession(){let raw=localStorage.getItem(SESSION_KEY)||sessionStorage.getItem(SESSION_KEY);if(!raw)return;try{const s=JSON.parse(raw);if(!s||!s.token||!s.refreshToken||!s.u||!s.k)throw Error('invalid session');$('url').value=s.u;$('key').value=s.k;$('email').value=s.email||'';$('remember').checked=!!localStorage.getItem(SESSION_KEY);token=s.token;refreshToken=s.refreshToken;expiresAt=Number(s.expiresAt)||0;await ensureToken();$('login').style.display='none';$('app').style.display='block';await load(true)}catch(e){clearSession();$('login').style.display='block';$('app').style.display='none';msg('Увійдіть повторно: '+e.message)}}
function config(){const u=$('url').value.trim().replace(/\/$/,'');if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(u))throw Error('Введіть адресу проєкту Supabase (https://…supabase.co)');const k=$('key').value.trim();if(!/^(sb_publishable_|eyJ)/.test(k))throw Error('Потрібен публічний ключ, не service_role');return {u,k}}async function json(r){let d;try{d=await r.json()}catch{throw Error('Помилка відповіді сервера: '+r.status)}if(!r.ok||d.ok===false)throw Error(d.error_description||d.msg||d.error||'HTTP '+r.status);return d}async function login(){try{$('enter').disabled=true;msg('Вхід…');const {u,k}=config();const r=await fetch(u+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json',apikey:k},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});const d=await json(r);acceptSession(d);localStorage.setItem('acl_remember',String($('remember').checked));for(const id of ['url','key','email'])localStorage.setItem('acl_'+id,$(id).value.trim());$('password').value='';$('login').style.display='none';$('app').style.display='block';msg('');await load(true)}catch(e){msg('Помилка: '+e.message)}finally{$('enter').disabled=false}}async function load(reset){if(busy)return;busy=true;try{const {u,k}=config();if(reset){offset=0;query=$('search').value.trim();$('items').replaceChildren()}msg('Завантаження…');const p=new URLSearchParams({action:'products-search',q:query,offset:String(offset),limit:'50'});const access=await ensureToken();const d=await json(await fetch(u+'/functions/v1/autocomplex-cloud-lite?'+p,{headers:{apikey:k,Authorization:'Bearer '+access}}));$('count').textContent='Знайдено: '+d.count;for(const product of d.products){const div=document.createElement('div');div.className='item';const name=document.createElement('strong');name.textContent=product.name||'Без назви';const info=document.createElement('div');info.className='muted';info.textContent='Артикул: '+(product.article||'—')+' · Залишок: '+(product.quantity??'—')+(product.purchase_price==null?'':' · Закупівельна: '+product.purchase_price+' грн')+(product.sale_price==null?'':' · Продажна: '+product.sale_price+' грн');div.append(name,info);const edit=document.createElement('button');edit.className='edit';edit.textContent='Змінити ціни';edit.onclick=()=>{edit.style.display='none';const form=document.createElement('form');form.className='price-form';const makeField=(title,value)=>{const label=document.createElement('label');label.textContent=title;const input=document.createElement('input');input.type='number';input.min='0';input.max='999999999';input.step='0.01';input.required=true;input.value=String(value??0);label.append(input);form.append(label);return input};const purchase=makeField('Закупівельна ціна, грн',product.purchase_price);const sale=makeField('Продажна ціна, грн',product.sale_price);const note=document.createElement('p');note.className='muted notice';note.textContent='Змінюються лише ціни у хмарі. Синхронізація з Windows не підтверджена.';const save=document.createElement('button');save.type='submit';save.textContent='Зберегти ціни';const cancel=document.createElement('button');cancel.type='button';cancel.textContent='Скасувати';cancel.onclick=()=>{form.remove();edit.style.display='block'};form.append(note,save,cancel);form.onsubmit=async event=>{event.preventDefault();if(busy)return;const a=Number(purchase.value),b=Number(sale.value);if(!Number.isFinite(a)||!Number.isFinite(b)||a<0||b<0||a>999999999||b>999999999||Math.round(a*100)!==a*100||Math.round(b*100)!==b*100){msg('Некоректна ціна');return}if(!confirm('Зберегти нові ціни у хмарі? Це НЕ оновить автоматично базу Windows.'))return;busy=true;save.disabled=true;try{const {u,k}=config();const access=await ensureToken();const result=await json(await fetch(u+'/functions/v1/autocomplex-cloud-lite?action=price-update',{method:'POST',headers:{apikey:k,Authorization:'Bearer '+access,'Content-Type':'application/json'},body:JSON.stringify({id:product.id,sync_revision:product.sync_revision,purchase_price:a,sale_price:b})}));product.purchase_price=result.product.purchase_price;product.sale_price=result.product.sale_price;product.sync_revision=result.product.sync_revision;info.textContent='Артикул: '+(product.article||'—')+' · Залишок: '+(product.quantity??'—')+' · Закупівельна: '+product.purchase_price+' грн · Продажна: '+product.sale_price+' грн';form.remove();edit.style.display='block';msg('Ціни збережено у хмарі. Windows-база не змінена.')}catch(e){msg('Помилка збереження: '+e.message+'. Якщо conflict — оновіть пошук і повторіть.')}finally{busy=false;save.disabled=false}};div.append(form)};div.append(edit);$('items').append(div)}offset+=d.products.length;$('more').style.display=offset<d.count?'block':'none';msg('')}catch(e){msg('Помилка: '+e.message)}finally{busy=false}}$('enter').onclick=login;$('find').onclick=()=>load(true);$('search').onkeydown=e=>{if(e.key==='Enter')load(true)};$('more').onclick=()=>load(false);$('exit').onclick=()=>{clearSession();$('app').style.display='none';$('login').style.display='block';$('items').replaceChildren();msg('Сесію завершено')};restoreSession();
</script></body></html>
