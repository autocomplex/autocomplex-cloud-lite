<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autocomplex Cloud Lite</title><style>body{font:16px system-ui;background:#0e1b32;color:#eef5ff;margin:0;padding:16px}main{max-width:760px;margin:auto}input,button{box-sizing:border-box;width:100%;padding:14px;margin:7px 0;border-radius:9px;border:1px solid #64748b;font:inherit}button{background:#1976df;color:white;border:0}button:disabled{opacity:.5}.item{padding:12px;border-bottom:1px solid #46536a}.muted{color:#b7c7dc;font-size:13px}#app{display:none}#message{white-space:pre-wrap}</style></head><body><main><h2>Автокомплекс · Cloud Lite</h2><p class="muted">Перегляд каталогу · тільки читання · потрібен інтернет</p><section id="login"><input id="url" placeholder="https://PROJECT.supabase.co" autocomplete="url"><input id="key" placeholder="Publishable key (sb_publishable_...)" autocomplete="off"><input id="email" type="email" placeholder="Email" autocomplete="username"><input id="password" type="password" placeholder="Пароль" autocomplete="current-password"><button id="enter">Увійти</button><p class="muted">URL, ключ та email зберігаються лише в цьому браузері. Пароль і токен не зберігаються.</p></section><section id="app"><button id="exit">Вийти</button><input id="search" placeholder="Назва або артикул"><button id="find">Знайти</button><p id="count"></p><div id="items"></div><button id="more" style="display:none">Ще товари</button></section><p id="message" role="status"></p></main><script>
'use strict';const $=id=>document.getElementById(id);let token='',offset=0,query='',busy=false;for(const id of ['url','key','email'])$(id).value=localStorage.getItem('acl_'+id)||'';function msg(t){$('message').textContent=t}function config(){const u=$('url').value.trim().replace(/\/$/,'');if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(u))throw Error('Введіть адресу проєкту Supabase (https://…supabase.co)');const k=$('key').value.trim();if(!/^(sb_publishable_|eyJ)/.test(k))throw Error('Потрібен публічний ключ, не service_role');return {u,k}}async function json(r){let d;try{d=await r.json()}catch{throw Error('Помилка відповіді сервера: '+r.status)}if(!r.ok||d.ok===false)throw Error(d.error_description||d.msg||d.error||'HTTP '+r.status);return d}async function login(){try{$('enter').disabled=true;msg('Вхід…');const {u,k}=config();const r=await fetch(u+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json',apikey:k},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});const d=await json(r);token=d.access_token;for(const id of ['url','key','email'])localStorage.setItem('acl_'+id,$(id).value.trim());$('password').value='';$('login').style.display='none';$('app').style.display='block';msg('');await load(true)}catch(e){msg('Помилка: '+e.message)}finally{$('enter').disabled=false}}async function load(reset){if(busy)return;busy=true;try{const {u,k}=config();if(reset){offset=0;query=$('search').value.trim();$('items').replaceChildren()}msg('Завантаження…');const p=new URLSearchParams({action:'products-search',q:query,offset:String(offset),limit:'50'});const d=await json(await fetch(u+'/functions/v1/autocomplex-cloud-lite?'+p,{headers:{apikey:k,Authorization:'Bearer '+token}}));$('count').textContent='Знайдено: '+d.count;for(const product of d.products){const div=document.createElement('div');div.className='item';const name=document.createElement('strong');name.textContent=product.name||'Без назви';const info=document.createElement('div');info.className='muted';info.textContent='Артикул: '+(product.article||'—')+' · Залишок: '+(product.quantity??'—')+(product.purchase_price==null?'':' · Закупівельна: '+product.purchase_price+' грн')+(product.sale_price==null?'':' · Продажна: '+product.sale_price+' грн');div.append(name,info);$('items').append(div)}offset+=d.products.length;$('more').style.display=offset<d.count?'block':'none';msg('')}catch(e){msg('Помилка: '+e.message)}finally{busy=false}}$('enter').onclick=login;$('find').onclick=()=>load(true);$('search').onkeydown=e=>{if(e.key==='Enter')load(true)};$('more').onclick=()=>load(false);$('exit').onclick=()=>{token='';$('app').style.display='none';$('login').style.display='block';$('items').replaceChildren();msg('Сесію завершено')};
</script></body></html>
